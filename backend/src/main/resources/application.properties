# Application Configuration
spring.application.name=datenraum-ostfriesland

# Server Configuration
server.port=8080

# Database Configuration (H2 file-based for development)
spring.datasource.url=jdbc:h2:file:./data/datenraum;DB_CLOSE_ON_EXIT=TRUE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtaGFja2F0aG9uLWRhdGVucmF1bS1vc3Rmcmllc2xhbmQtcHJvamVjdA==
jwt.expiration=86400000

