# Application Configuration
spring.application.name=datenraum-ostfriesland

# Active Profile (change this to switch between databases)
# Use "h2" for H2 database or "mysql" for MySQL database
spring.profiles.active=h2

# Server Configuration
server.port=8080

# JPA Configuration (shared)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtaGFja2F0aG9uLWRhdGVucmF1bS1vc3Rmcmllc2xhbmQtcHJvamVjdA==
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Uploads Directory
app.upload.dir=./uploads/certificates/

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.de.eq3.hackathon=DEBUG
logging.level.org.springframework.security=DEBUG
